services:

  # =========================================
  # MONGODB
  # =========================================
  mongodb:
    image: mongo:7
    container_name: mongodb

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    networks:
      - inventory-network

  # =========================================
  # MYSQL
  # =========================================
  mysql:
    image: mysql:8.4
    container_name: mysql

    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: stockdb

    ports:
      - "3307:3306"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - inventory-network

  # =========================================
  # REDIS
  # =========================================
  redis:
    image: redis:7
    container_name: redis

    restart: unless-stopped

    ports:
      - "6379:6379"

    networks:
      - inventory-network

  # =========================================
  # ZOOKEEPER
  # =========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper

    restart: unless-stopped

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

    ports:
      - "2181:2181"

    networks:
      - inventory-network

  # =========================================
  # KAFKA
  # =========================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka

    restart: unless-stopped

    depends_on:
      - zookeeper

    ports:
      - "9092:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - inventory-network

  # =========================================
  # ELASTICSEARCH
  # =========================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    container_name: elasticsearch

    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: false
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    networks:
      - inventory-network

  # =========================================
  # KEYCLOAK
  # =========================================
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak

    restart: unless-stopped

    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8085
      KC_HOSTNAME_STRICT: false

      KC_HTTP_ENABLED: true
      KC_PROXY: edge

    command: start-dev

    ports:
      - "8085:8080"

    volumes:
      - keycloak-data:/opt/keycloak/data

    networks:
      - inventory-network
  # =========================================
  # ITEM SERVICE
  # =========================================
  item-service:
    image: rashmiabhay/item-service:1.0
    container_name: item-service

    restart: unless-stopped

    depends_on:
      - mongodb
      - kafka

    ports:
      - "8080:8080"

    networks:
      - inventory-network

  # =========================================
  # STOCK SERVICE

  stock-service:

    build:
      context: ./stock-service
      dockerfile: Dockerfile

    image: rashmiabhay/stock-service:1.0

    container_name: stock-service

    restart: unless-stopped

    depends_on:
      - mysql
      - kafka

    ports:
      - "8081:8081"

    networks:
      - inventory-network
  # =========================================
  # INVENTORY SEARCH INDEXER
  # =========================================
  inventory-search-indexer:
    image: rashmiabhay/inventory-search-indexer:1.0
    container_name: inventory-search-indexer

    restart: unless-stopped

    depends_on:
      - kafka
      - elasticsearch

    ports:
      - "8083:8083"

    networks:
      - inventory-network

  # =========================================
  # INVENTORY BFF SERVICE
  # =========================================
  inventory-bff-service:
    image: rashmiabhay/inventory-bff-service:1.0
    container_name: inventory-bff-service

    restart: unless-stopped

    depends_on:
      - item-service
      - stock-service
      - elasticsearch

    ports:
      - "8082:8082"

    networks:
      - inventory-network

  # =========================================
  # API GATEWAY
  # =========================================
  inventory-api-gateway:
    image: rashmiabhay/inventory-api-gateway:1.0
    container_name: inventory-api-gateway

    restart: unless-stopped

    depends_on:
      - redis
      - keycloak
      - inventory-bff-service

    ports:
      - "9090:9090"

    networks:
      - inventory-network

# =========================================
# NETWORKS
# =========================================
networks:
  inventory-network:

# =========================================
# VOLUMES
# =========================================
volumes:
  mysql-data:
  mongo-data:
  keycloak-data:
  elasticsearch-data:
  kafka-data: