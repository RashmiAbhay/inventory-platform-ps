spring.application.name=inventory-api-gateway

server.port=9090


# =========================================
# ITEM SERVICE ROUTE
# =========================================

spring.cloud.gateway.server.webflux.routes[0].id=item-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://item-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/items/**


# =========================================
# STOCK SERVICE ROUTE
# =========================================

spring.cloud.gateway.server.webflux.routes[1].id=stock-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://stock-service:8081
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/stocks/**


# =========================================
# INVENTORY BFF ROUTE
# =========================================

spring.cloud.gateway.server.webflux.routes[2].id=inventory-bff-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://inventory-bff-service:8082
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/inventory/**,/inventoryElasticSearch/**


# =========================================
# CIRCUIT BREAKER
# =========================================

spring.cloud.gateway.server.webflux.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.name=inventoryCircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.fallbackUri=forward:/fallback/inventory


# =========================================
# RETRY
# =========================================

spring.cloud.gateway.server.webflux.routes[2].filters[1].name=Retry
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.retries=3
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.methods[0]=GET
spring.cloud.gateway.server.webflux.routes[2].filters[1].args.statuses[0]=INTERNAL_SERVER_ERROR


# =========================================
# HTTP CLIENT TIMEOUT
# =========================================

spring.cloud.gateway.server.webflux.httpclient.connect-timeout=2000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=5s


# =========================================
# REDIS
# =========================================

spring.data.redis.host=redis
spring.data.redis.port=6379


# =========================================
# RATE LIMITER
# =========================================

spring.cloud.gateway.server.webflux.routes[2].filters[2].name=RequestRateLimiter
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.redis-rate-limiter.replenishRate=10
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.redis-rate-limiter.burstCapacity=20
spring.cloud.gateway.server.webflux.routes[2].filters[2].args.keyResolver=#{@ipKeyResolver}

logging.level.org.springframework.cloud.gateway.filter.ratelimit=DEBUG


# =========================================
# OAUTH2 / KEYCLOAK
# =========================================



spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/inventory-platform


# ACTUATOR
# =========================================

logging.pattern.console=%d [%X{X-Correlation-ID}] %-5level %logger - %msg%n

management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.gateway.access=unrestricted
management.endpoint.health.show-details=always