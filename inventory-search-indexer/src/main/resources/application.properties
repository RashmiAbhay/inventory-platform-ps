spring.application.name=inventory-search-indexer

server.port=8083

# =========================================
# KAFKA
# =========================================
spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=search-indexer-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# =========================================
# ELASTICSEARCH
# =========================================
spring.elasticsearch.uris=http://elasticsearch:9200
spring.elasticsearch.indices.create=false
# =========================================
# ACTUATOR
# =========================================
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=always

# =========================================
# LOGGING
# =========================================
logging.pattern.console=%d [%X{X-Correlation-ID}] %-5level %logger - %msg%n